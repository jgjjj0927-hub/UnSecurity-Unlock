<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8fc8"/>
      <stop offset="100%" stop-color="#d6338a"/>
    </linearGradient>
    <linearGradient id="pinkGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3d9"/>
      <stop offset="100%" stop-color="#ff5fa8"/>
    </linearGradient>
  </defs>

  <!-- чёрный фон с лёгким градиентом как в 2007 -->
  <rect width="256" height="256" rx="24" fill="url(#bgGrad)"/>

  <!-- верхняя светлая полоска (как у старых иконок) -->
  <rect x="0" y="0" width="256" height="70" rx="24" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="0" y="70" width="256" height="1" fill="#ffffff" fill-opacity="0.06"/>

  <!-- розовые квадратики: 3x3 сетка, разные оттенки -->
  <g>
    <!-- ряд 1 -->
    <rect x="48"  y="48"  width="44" height="44" rx="4" fill="url(#pinkGrad2)"/>
    <rect x="106" y="48"  width="44" height="44" rx="4" fill="url(#pinkGrad)"/>
    <rect x="164" y="48"  width="44" height="44" rx="4" fill="url(#pinkGrad2)"/>

    <!-- ряд 2 -->
    <rect x="48"  y="106" width="44" height="44" rx="4" fill="url(#pinkGrad)"/>
    <rect x="106" y="106" width="44" height="44" rx="4" fill="url(#pinkGrad2)"/>
    <rect x="164" y="106" width="44" height="44" rx="4" fill="url(#pinkGrad)"/>

    <!-- ряд 3 -->
    <rect x="48"  y="164" width="44" height="44" rx="4" fill="url(#pinkGrad2)"/>
    <rect x="106" y="164" width="44" height="44" rx="4" fill="url(#pinkGrad)"/>
    <rect x="164" y="164" width="44" height="44" rx="4" fill="url(#pinkGrad2)"/>
  </g>

  <!-- блики на квадратах (как в 2007) -->
  <rect x="48"  y="48"  width="44" height="18" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="106" y="48"  width="44" height="18" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="164" y="48"  width="44" height="18" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="48"  y="106" width="44" height="18" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="106" y="106" width="44" height="18" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="164" y="106" width="44" height="18" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="48"  y="164" width="44" height="18" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="106" y="164" width="44" height="18" rx="4" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="164" y="164" width="44" height="18" rx="4" fill="#ffffff" fill-opacity="0.25"/>

  <!-- подпись -->
  <text x="128" y="240"
        text-anchor="middle"
        font-family="Tahoma, Verdana, sans-serif"
        font-size="10"
        letter-spacing="0.5"
        fill="#ff8fc8"
        fill-opacity="0.45">z00xTeam</text>
</svg>
