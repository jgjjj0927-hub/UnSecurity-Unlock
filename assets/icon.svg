<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <pattern id="checker" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#0a0a0a"/>
      <rect width="16" height="16" fill="#ff00aa"/>
      <rect x="16" y="16" width="16" height="16" fill="#ff00aa"/>
    </pattern>
  </defs>

  <!-- фон -->
  <rect width="256" height="256" fill="url(#checker)"/>

  <!-- затемнение по краям, чтобы в глаза не бросалось -->
  <rect width="256" height="256" fill="#000000" fill-opacity="0.35"/>

  <!-- подпись -->
  <text x="128" y="240"
        text-anchor="middle"
        font-family="Tahoma, Verdana, sans-serif"
        font-size="10"
        letter-spacing="0.5"
        fill="#ff00aa"
        fill-opacity="0.55">z00xTeam</text>
</svg>
